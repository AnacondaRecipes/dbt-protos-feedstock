{% set name = "dbt-protos" %}
{% set version = "1.0.514" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 4429a8b0675140467206aaaf9d9468e619a9697f443e4b3921f297d01e4a77a0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - protobuf >=3.17.1

test:
  source_files:
    - test
  imports:
    - dbtlabs
  commands:
    - pip check
    - python test/import_test.py
  requires:
    - pip

about:
  home: https://github.com/dbt-labs/proto-python-public
  summary: Public proto bindings for dbt
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: Public proto bindings for dbt
  dev_url: https://github.com/dbt-labs/proto-python-public
  doc_url: https://github.com/dbt-labs/proto-python-public/blob/main/README.md

extra:
  recipe-maintainers:
    - rxm7706
